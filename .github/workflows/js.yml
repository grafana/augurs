name: augurs-js

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  test:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just,wasm-pack

      - name: Build augurs-js
        run: just build-augurs-js

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: js/.node-version
      - name: Install dependencies
        run: npm ci
        working-directory: js/testpkg
      - name: Run typecheck
        run: npm run typecheck
        working-directory: js/testpkg
      - name: Run tests
        run: npm run test:ci
        working-directory: js/testpkg

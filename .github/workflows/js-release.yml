# JavaScript package release workflow for @bsull/augurs
#
# This workflow builds, tests, and publishes the npm package.
# It runs on:
# - GitHub Release published (filtered to augurs-v* tags, triggered by release-plz)
# - Manual workflow dispatch
#
# npm provenance is provided via OIDC - no NPM_TOKEN secret needed.
# Configure "trusted publishers" on npmjs.com for this repo.

name: JS Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm"
        required: false
        default: false
        type: boolean

concurrency:
  group: js-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Only run for the main augurs crate release (not augurs-core, augurs-prophet, etc.)
    if: >-
      github.repository_owner == 'grafana' && (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.event.release.tag_name, 'augurs-v')
      )
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,wasm-pack

      - name: Build augurs-js
        run: just build-augurs-js

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: js/.node-version
          registry-url: "https://registry.npmjs.org"
          # Disable caching in this release workflow to avoid cache poisoning.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: js/testpkg
      - name: Run typecheck
        run: npm run typecheck
        working-directory: js/testpkg
      - name: Run tests
        run: npm run test:ci
        working-directory: js/testpkg

      - name: Upload JS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-package
          path: js/augurs/
          retention-days: 5

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download JS package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-package
          path: package/

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: js/.node-version
          registry-url: "https://registry.npmjs.org"
          # Disable caching in this release workflow to avoid cache poisoning.
          package-manager-cache: false

      - name: Publish to npm
        working-directory: package
        run: npm publish --provenance --access public
